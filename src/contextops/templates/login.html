{% extends "base.html" %}
{% block title %}ContextOps · Sign in{% endblock %}
{% block content %}
<main id="main" class="page-shell login-shell">
  <section class="dark-card login-card" aria-labelledby="login-title">
    <p class="eyebrow">Administrator access</p>
    <h1 id="login-title">Sign in to ContextOps</h1>
    <p class="hero-copy">Use the configured administrator account to open the review workspace.</p>
    {% if error %}
    <div class="form-error" role="alert">{{ error }}</div>
    {% endif %}
    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ request.state.login_csrf_token }}">
      <input type="hidden" name="next" value="{{ next_destination }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>
</main>
{% endblock %}
